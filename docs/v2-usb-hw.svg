<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="2" y="2" width="796" height="296" rx="24" fill="#EAF5FC" stroke="#cfe6f5" stroke-width="3"/>
  <rect x="24" y="16" width="116" height="28" rx="14" fill="#ffd23f" stroke="#1d2330" stroke-width="2"/>
  <text x="82" y="35" font-size="13" font-weight="800" fill="#1d2330" text-anchor="middle">NEW in V2.0</text>

  <!-- keyboard on a cable -->
  <path d="M52 196C20 220 30 262 70 262" fill="none" stroke="#3d434d" stroke-width="4" stroke-linecap="round"/>
  <rect x="64" y="246" width="100" height="34" rx="6" fill="#fff" stroke="#1d2330" stroke-width="3"/>
  <g fill="#c5cad3"><rect x="72" y="252" width="10" height="7" rx="1.5"/><rect x="86" y="252" width="10" height="7" rx="1.5"/><rect x="100" y="252" width="10" height="7" rx="1.5"/>
    <rect x="114" y="252" width="10" height="7" rx="1.5"/><rect x="128" y="252" width="10" height="7" rx="1.5"/><rect x="142" y="252" width="14" height="7" rx="1.5"/>
    <rect x="72" y="263" width="10" height="7" rx="1.5"/><rect x="86" y="263" width="52" height="7" rx="1.5"/><rect x="142" y="263" width="14" height="7" rx="1.5"/></g>

  <!-- USB stick plugged into the mascot's side -->
  <rect x="210" y="150" width="20" height="22" rx="2" fill="#c5cad3" stroke="#1d2330" stroke-width="3"/>
  <rect x="226" y="140" width="54" height="42" rx="8" fill="#e74c3c" stroke="#1d2330" stroke-width="3"/>
  <rect x="236" y="150" width="34" height="8" rx="4" fill="#fff" opacity=".6"/>
  <text x="253" y="176" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">USB</text>

  <!-- SmartHub mascot -->
  <g transform="translate(40 76) scale(.9)">
    <rect x="-12" y="138" width="224" height="14" rx="5" fill="#3d434d" stroke="#1d2330" stroke-width="3"/>
    <rect x="160" y="-30" width="16" height="80" rx="8" fill="#5b616c" stroke="#1d2330" stroke-width="4"/>
    <rect x="0" y="30" width="200" height="115" rx="20" fill="#2b2f36" stroke="#1d2330" stroke-width="4"/>
    <path d="M22 50h156M22 62h156" stroke="#3f4550" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="70" cy="95" rx="11" ry="13" fill="#fff"/><ellipse cx="130" cy="95" rx="11" ry="13" fill="#fff"/>
    <circle cx="76" cy="97" r="5.5" fill="#1d2330"/><circle cx="136" cy="97" r="5.5" fill="#1d2330"/>
    <circle cx="78" cy="94" r="2" fill="#fff"/><circle cx="138" cy="94" r="2" fill="#fff"/>
    <ellipse cx="100" cy="119" rx="9" ry="7" fill="#fff"/>
    <circle cx="48" cy="114" r="7" fill="#ff8fa3" opacity=".6"/><circle cx="152" cy="114" r="7" fill="#ff8fa3" opacity=".6"/>
    <text x="100" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#9fd3f0">IRIV SmartHub CM5</text>
  </g>
  <text x="140" y="60" font-size="15" font-weight="800" fill="#1d2330" text-anchor="middle">"I see what's plugged in!"</text>

  <!-- USB card -->
  <rect x="300" y="24" width="236" height="252" rx="14" fill="#fff" stroke="#cfe6f5" stroke-width="3"/>
  <text x="318" y="54" font-size="17" font-weight="800" fill="#1d2330">USB ports</text>
  <g>
    <circle cx="324" cy="84" r="5" fill="#1f9d55"/>
    <text x="336" y="89" font-size="14" font-weight="700" fill="#1d2330">USB 3.0 port 1</text>
    <text x="336" y="108" font-size="12.5" fill="#6b7684">SanDisk USB · 5000 Mb/s</text>
    <path d="M318 122h200" stroke="#e2e7ed" stroke-width="1.5"/>
    <circle cx="324" cy="142" r="5" fill="#d5dbe2"/>
    <text x="336" y="147" font-size="14" font-weight="700" fill="#1d2330">USB 3.0 port 2</text>
    <text x="336" y="166" font-size="12.5" fill="#aab2bc">empty</text>
    <path d="M318 180h200" stroke="#e2e7ed" stroke-width="1.5"/>
    <circle cx="324" cy="200" r="5" fill="#1f9d55"/>
    <text x="336" y="205" font-size="14" font-weight="700" fill="#1d2330">USB 2.0 hub port 2</text>
    <text x="336" y="224" font-size="12.5" fill="#6b7684">Keyboard · 1.5 Mb/s</text>
  </g>
  <text x="318" y="260" font-size="11.5" fill="#8d99a8">Empty ports are listed too</text>

  <!-- Hardware card -->
  <rect x="552" y="24" width="228" height="252" rx="14" fill="#fff" stroke="#cfe6f5" stroke-width="3"/>
  <text x="570" y="54" font-size="17" font-weight="800" fill="#1d2330">Hardware check</text>
  <g font-size="13" fill="#1d2330">
    <g fill="#1f9d55"><circle cx="578" cy="80" r="8"/><circle cx="578" cy="104" r="8"/><circle cx="578" cy="128" r="8"/><circle cx="578" cy="152" r="8"/>
      <circle cx="578" cy="176" r="8"/><circle cx="578" cy="200" r="8"/><circle cx="578" cy="224" r="8"/></g>
    <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M574 80l3 3l5 -6M574 104l3 3l5 -6M574 128l3 3l5 -6M574 152l3 3l5 -6M574 176l3 3l5 -6M574 200l3 3l5 -6M574 224l3 3l5 -6"/></g>
    <circle cx="578" cy="248" r="8" fill="#d03a2f"/>
    <path d="M574.5 244.5l7 7M581.5 244.5l-7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <text x="594" y="85">Compute Module 5</text><text x="594" y="109">RAM 8 GB · eMMC 31 GB</text>
    <text x="594" y="133">WiFi + Bluetooth</text><text x="594" y="157">Ethernet 1000 Mb/s</text>
    <text x="594" y="181">USB 2.0 hub</text><text x="594" y="205">Power: no under-voltage</text>
    <text x="594" y="229">CPU 48 °C</text><text x="594" y="253" fill="#d03a2f" font-weight="700">RTC battery low / none</text>
  </g>
</svg>
