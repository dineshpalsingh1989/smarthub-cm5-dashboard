<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="2" y="2" width="796" height="296" rx="24" fill="#EAF5FC" stroke="#cfe6f5" stroke-width="3"/>
  <circle cx="46" cy="46" r="24" fill="#1E9AD6"/>
  <text x="46" y="55" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">4</text>

  <!-- browser window -->
  <rect x="90" y="22" width="450" height="262" rx="14" fill="#fff" stroke="#1d2330" stroke-width="3"/>
  <path d="M92 36a12 12 0 0 1 12 -12h422a12 12 0 0 1 12 12v32h-446z" fill="#e9edf2"/>
  <circle cx="110" cy="46" r="6" fill="#ff5f57"/><circle cx="128" cy="46" r="6" fill="#febc2e"/><circle cx="146" cy="46" r="6" fill="#28c840"/>
  <rect x="166" y="34" width="360" height="26" rx="13" fill="#fff" stroke="#1E9AD6" stroke-width="2.5"/>
  <text x="182" y="52" font-size="15" font-family="Consolas,Menlo,monospace" fill="#777">http://<tspan font-weight="700" fill="#0B5E92">192.168.4.1:8080</tspan></text>
  <rect x="390" y="39" width="2" height="16" fill="#1d2330"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <!-- pointer cursor -->
  <path d="M470 50l0 26l7 -7l5 11l5 -2l-5 -11l10 0z" fill="#fff" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/>

  <!-- mini dashboard -->
  <text x="110" y="98" font-size="20" font-weight="800" font-style="italic" fill="#1E9AD6">Cytron</text>
  <text x="188" y="97" font-size="16" font-weight="800" fill="#1d2330">SmartHub CM5 Network</text>

  <rect x="108" y="110" width="414" height="52" rx="8" fill="#f2f4f7"/>
  <text x="120" y="129" font-size="12" font-weight="700" fill="#1d2330">Status</text>
  <text x="120" y="150" font-size="12" font-family="Consolas,Menlo,monospace" fill="#444">wlan0: connected smarthub-ap 192.168.4.1/24</text>

  <rect x="108" y="170" width="414" height="58" rx="8" fill="#f2f4f7"/>
  <text x="120" y="189" font-size="12" font-weight="700" fill="#1d2330">Docker</text>
  <text x="120" y="213" font-size="13" font-weight="800" fill="#1d2330">beaver-iot</text>
  <rect x="192" y="201" width="68" height="16" rx="8" fill="#2e9e5b"/>
  <text x="226" y="213" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">RUNNING</text>
  <rect x="380" y="200" width="66" height="20" rx="5" fill="#1E9AD6"/>
  <text x="413" y="214" font-size="11" fill="#fff" text-anchor="middle">Restart</text>
  <rect x="452" y="200" width="56" height="20" rx="5" fill="#c0392b"/>
  <text x="480" y="214" font-size="11" fill="#fff" text-anchor="middle">Stop</text>

  <rect x="108" y="236" width="414" height="38" rx="8" fill="#f2f4f7"/>
  <rect x="120" y="244" width="190" height="22" rx="5" fill="#1E9AD6"/>
  <text x="215" y="259" font-size="11" fill="#fff" text-anchor="middle">Search WiFi</text>
  <rect x="320" y="244" width="190" height="22" rx="5" fill="#1E9AD6"/>
  <text x="415" y="259" font-size="11" fill="#fff" text-anchor="middle">Apply</text>

  <!-- hint card -->
  <rect x="566" y="22" width="212" height="160" rx="14" fill="#fff" stroke="#cfe6f5" stroke-width="3"/>
  <text x="584" y="52" font-size="17" font-weight="800" fill="#1d2330">Open a browser</text>
  <text x="584" y="76" font-size="13" fill="#444">Type the address the</text>
  <text x="584" y="94" font-size="13" fill="#444">installer printed:</text>
  <text x="584" y="124" font-size="18" font-weight="800" fill="#0B5E92" font-family="Consolas,Menlo,monospace">192.168.4.1:8080</text>
  <text x="584" y="150" font-size="12" fill="#777">just 192.168.4.1 if</text>
  <text x="584" y="167" font-size="12" fill="#777">port 80 was free</text>

  <rect x="566" y="194" width="212" height="90" rx="14" fill="#fff3a3" stroke="#e0c84a" stroke-width="2"/>
  <text x="584" y="222" font-size="14" font-weight="800" fill="#6b5d10">Tip</text>
  <text x="584" y="244" font-size="13" fill="#6b5d10">Phone, tablet or laptop.</text>
  <text x="584" y="264" font-size="13" fill="#6b5d10">No app needed.</text>
</svg>
