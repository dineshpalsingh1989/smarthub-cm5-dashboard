    <text x="100" y="228" font-size="6.5" font-weight="700" fill="#0a84c6" text-anchor="middle">Search WiFi</text>
  </g>

  <!-- ===== phone 2: Devices ===== -->
  <g transform="translate(300 70)">
    <rect width="200" height="250" rx="22" fill="#1d2330"/>
    <rect x="9" y="20" width="182" height="222" rx="10" fill="#eef2f6"/>
    <rect x="80" y="8" width="40" height="6" rx="3" fill="#3d434d"/>
    <rect x="9" y="20" width="182" height="40" rx="10" fill="#fff"/>
    <rect x="17" y="27" width="26" height="8" rx="4" fill="#1E9AD6"/>
    <text x="48" y="34" font-size="8" font-weight="800" fill="#1d2330">SmartHub CM5</text>
    <rect x="132" y="26" width="52" height="11" rx="5.5" fill="#fff3d9"/>
    <text x="158" y="34" font-size="6.5" font-weight="700" fill="#c27c0e" text-anchor="middle">Hotspot on</text>
    <rect x="74" y="43" width="52" height="12" rx="6" fill="#e4f2fb"/>
    <g font-size="7" font-weight="700" text-anchor="middle"><text x="41" y="52" fill="#8d99a8">Network</text>
      <text x="100" y="52" fill="#0a84c6">Devices</text><text x="159" y="52" fill="#8d99a8">System</text></g>
    <rect x="16" y="66" width="168" height="84" rx="6" fill="#fff"/>
    <text x="23" y="80" font-size="8" font-weight="800" fill="#16202c">USB ports</text>
    <g font-size="7">
      <circle cx="26" cy="94" r="2.5" fill="#1f9d55"/><text x="32" y="96.5" font-weight="700" fill="#16202c">USB 3.0 port 1</text><text x="178" y="96.5" fill="#6b7684" text-anchor="end">SanDisk · 5 Gb/s</text>
      <path d="M22 103h156" stroke="#e2e7ed"/>
      <circle cx="26" cy="113" r="2.5" fill="#d5dbe2"/><text x="32" y="115.5" font-weight="700" fill="#16202c">USB 3.0 port 2</text><text x="178" y="115.5" fill="#aab2bc" text-anchor="end">empty</text>
      <path d="M22 122h156" stroke="#e2e7ed"/>
      <circle cx="26" cy="132" r="2.5" fill="#1f9d55"/><text x="32" y="134.5" font-weight="700" fill="#16202c">USB 2.0 hub 2</text><text x="178" y="134.5" fill="#6b7684" text-anchor="end">Keyboard</text>
    </g>
    <rect x="16" y="156" width="168" height="80" rx="6" fill="#fff"/>
    <text x="23" y="170" font-size="8" font-weight="800" fill="#16202c">Docker</text>
    <text x="23" y="186" font-size="7.5" font-weight="800" fill="#16202c">beaver-iot</text>
    <rect x="66" y="179" width="38" height="10" rx="5" fill="#e2f5e9"/><text x="85" y="186.5" font-size="5.5" font-weight="800" fill="#1f9d55" text-anchor="middle">RUNNING</text>
    <rect x="23" y="192" width="28" height="10" rx="3" fill="#e4f2fb"/><rect x="55" y="192" width="22" height="10" rx="3" fill="#d03a2f"/>
    <text x="23" y="217" font-size="7.5" font-weight="800" fill="#16202c">node-red</text>
    <rect x="61" y="210" width="32" height="10" rx="5" fill="#fde6e4"/><text x="77" y="217.5" font-size="5.5" font-weight="800" fill="#d03a2f" text-anchor="middle">ERROR</text>
    <rect x="23" y="223" width="22" height="10" rx="3" fill="#e4f2fb"/><rect x="49" y="223" width="28" height="10" rx="3" fill="#e4f2fb"/>
  </g>

  <!-- ===== phone 3: System ===== -->
  <g transform="translate(560 70)">
    <rect width="200" height="250" rx="22" fill="#1d2330"/>
    <rect x="9" y="20" width="182" height="222" rx="10" fill="#eef2f6"/>
    <rect x="80" y="8" width="40" height="6" rx="3" fill="#3d434d"/>
    <rect x="9" y="20" width="182" height="40" rx="10" fill="#fff"/>
    <rect x="17" y="27" width="26" height="8" rx="4" fill="#1E9AD6"/>
    <text x="48" y="34" font-size="8" font-weight="800" fill="#1d2330">SmartHub CM5</text>
    <rect x="132" y="26" width="52" height="11" rx="5.5" fill="#fff3d9"/>
    <text x="158" y="34" font-size="6.5" font-weight="700" fill="#c27c0e" text-anchor="middle">Hotspot on</text>
    <rect x="133" y="43" width="52" height="12" rx="6" fill="#e4f2fb"/>
    <g font-size="7" font-weight="700" text-anchor="middle"><text x="41" y="52" fill="#8d99a8">Network</text>
      <text x="100" y="52" fill="#8d99a8">Devices</text><text x="159" y="52" fill="#0a84c6">System</text></g>
    <rect x="16" y="66" width="168" height="122" rx="6" fill="#fff"/>
    <text x="23" y="80" font-size="8" font-weight="800" fill="#16202c">Hardware check</text>
    <rect x="142" y="72" width="36" height="11" rx="4" fill="#e4f2fb"/><text x="160" y="80" font-size="5.5" font-weight="700" fill="#0a84c6" text-anchor="middle">Check again</text>
    <g font-size="6.8">
      <g fill="#1f9d55"><circle cx="26" cy="93" r="2.5"/><circle cx="26" cy="105" r="2.5"/><circle cx="26" cy="117" r="2.5"/><circle cx="26" cy="129" r="2.5"/>
        <circle cx="26" cy="141" r="2.5"/><circle cx="26" cy="153" r="2.5"/><circle cx="26" cy="177" r="2.5"/></g>
      <circle cx="26" cy="165" r="2.5" fill="#d03a2f"/>
      <g font-weight="700" fill="#16202c"><text x="32" y="95.5">Compute Module 5</text><text x="32" y="107.5">RAM</text><text x="32" y="119.5">eMMC</text>
        <text x="32" y="131.5">WiFi + Bluetooth</text><text x="32" y="143.5">Ethernet</text><text x="32" y="155.5">USB 2.0 hub</text>
        <text x="32" y="167.5">RTC battery</text><text x="32" y="179.5">CPU temperature</text></g>
      <g fill="#6b7684" text-anchor="end"><text x="178" y="95.5">Rev 1.0</text><text x="178" y="107.5">8 GB</text><text x="178" y="119.5">31 GB</text>
        <text x="178" y="131.5">OK</text><text x="178" y="143.5">1000 Mb/s</text><text x="178" y="155.5">1a86:8091</text>
        <text x="178" y="167.5" fill="#d03a2f">low / none</text><text x="178" y="179.5">48 °C</text></g>
    </g>
    <rect x="16" y="194" width="168" height="42" rx="6" fill="#fff"/>
    <g font-size="6.8"><text x="23" y="208" font-weight="800" fill="#16202c">System &amp; software</text>
      <text x="23" y="220" font-weight="700" fill="#16202c">OS</text><text x="178" y="220" fill="#6b7684" text-anchor="end">Debian 12 (bookworm)</text>
      <text x="23" y="231" font-weight="700" fill="#16202c">Docker</text><text x="178" y="231" fill="#6b7684" text-anchor="end">27.3.1</text></g>
