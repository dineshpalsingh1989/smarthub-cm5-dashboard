<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="2" y="2" width="796" height="326" rx="24" fill="#EAF5FC" stroke="#cfe6f5" stroke-width="3"/>
  <rect x="24" y="16" width="116" height="28" rx="14" fill="#ffd23f" stroke="#1d2330" stroke-width="2"/>
  <text x="82" y="35" font-size="13" font-weight="800" fill="#1d2330" text-anchor="middle">NEW in V2.0</text>
  <text x="154" y="36" font-size="18" font-weight="800" fill="#1d2330">Overview tiles + three tabs</text>

  <g font-size="14" font-weight="800" fill="#0B5E92" text-anchor="middle">
    <text x="140" y="62">Network</text><text x="400" y="62">Devices</text><text x="660" y="62">System</text>
  </g>

  <!-- ===== phone 1: Network ===== -->
  <g transform="translate(40 70)">
    <rect width="200" height="250" rx="22" fill="#1d2330"/>
    <rect x="9" y="20" width="182" height="222" rx="10" fill="#eef2f6"/>
    <rect x="80" y="8" width="40" height="6" rx="3" fill="#3d434d"/>
    <rect x="9" y="20" width="182" height="40" rx="10" fill="#fff"/>
    <rect x="17" y="27" width="26" height="8" rx="4" fill="#1E9AD6"/>
    <text x="48" y="34" font-size="8" font-weight="800" fill="#1d2330">SmartHub CM5</text>
    <rect x="132" y="26" width="52" height="11" rx="5.5" fill="#fff3d9"/>
    <text x="158" y="34" font-size="6.5" font-weight="700" fill="#c27c0e" text-anchor="middle">Hotspot on</text>
    <rect x="15" y="43" width="52" height="12" rx="6" fill="#e4f2fb"/>
    <g font-size="7" font-weight="700" text-anchor="middle"><text x="41" y="52" fill="#0a84c6">Network</text>
      <text x="100" y="52" fill="#8d99a8">Devices</text><text x="159" y="52" fill="#8d99a8">System</text></g>
    <!-- tiles -->
    <g>
      <rect x="16" y="66" width="52" height="27" rx="5" fill="#fff"/><rect x="74" y="66" width="52" height="27" rx="5" fill="#fff"/><rect x="132" y="66" width="52" height="27" rx="5" fill="#fff"/>
      <rect x="16" y="97" width="52" height="27" rx="5" fill="#fff"/><rect x="74" y="97" width="52" height="27" rx="5" fill="#fff"/><rect x="132" y="97" width="52" height="27" rx="5" fill="#fff"/>
      <circle cx="22" cy="73" r="2.5" fill="#1f9d55"/><circle cx="80" cy="73" r="2.5" fill="#c27c0e"/><circle cx="138" cy="73" r="2.5" fill="#1f9d55"/>
      <circle cx="22" cy="104" r="2.5" fill="#1f9d55"/><circle cx="80" cy="104" r="2.5" fill="#1f9d55"/><circle cx="138" cy="104" r="2.5" fill="#d03a2f"/>
      <g font-size="5.5" fill="#6b7684"><text x="27" y="75">Ethernet</text><text x="85" y="75">WiFi</text><text x="143" y="75">USB</text>
