      <g font-size="7.5" font-weight="800" fill="#16202c"><text x="20" y="88">192.168.1.20</text><text x="78" y="88">Hotspot</text><text x="136" y="88">2</text>
        <text x="20" y="119">1 of 2</text><text x="78" y="119">48 °C</text><text x="136" y="119">1 issue</text></g>
    </g>
    <rect x="16" y="130" width="168" height="66" rx="6" fill="#fff"/>
    <text x="23" y="143" font-size="7.5" font-weight="800" fill="#16202c">Ethernet (eth0)</text>
    <rect x="22" y="149" width="156" height="15" rx="5" fill="#eef2f6"/>
    <rect x="24" y="151" width="76" height="11" rx="4" fill="#fff"/>
    <text x="62" y="159" font-size="6.5" font-weight="700" fill="#16202c" text-anchor="middle">Dynamic (DHCP)</text>
    <text x="139" y="159" font-size="6.5" fill="#6b7684" text-anchor="middle">Static</text>
    <rect x="22" y="170" width="156" height="15" rx="4" fill="#0a84c6"/>
    <text x="100" y="180" font-size="7" font-weight="700" fill="#fff" text-anchor="middle">Apply</text>
