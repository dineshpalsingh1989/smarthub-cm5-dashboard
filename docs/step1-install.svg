<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="2" y="2" width="796" height="276" rx="24" fill="#EAF5FC" stroke="#cfe6f5" stroke-width="3"/>
  <circle cx="46" cy="46" r="24" fill="#1E9AD6"/>
  <text x="46" y="55" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">1</text>

  <!-- terminal -->
  <g transform="translate(84 60)">
    <rect width="470" height="180" rx="14" fill="#1d2330" stroke="#0f141c" stroke-width="3"/>
    <path d="M0 14a14 14 0 0 1 14 -14h442a14 14 0 0 1 14 14v16h-470z" fill="#2e3542"/>
    <circle cx="20" cy="15" r="6" fill="#ff5f57"/><circle cx="40" cy="15" r="6" fill="#febc2e"/><circle cx="60" cy="15" r="6" fill="#28c840"/>
    <text x="235" y="20" font-size="12" fill="#8b949e" text-anchor="middle">SmartHub terminal</text>
    <g font-family="Consolas,Menlo,monospace" font-size="14" fill="#e6edf3">
      <text x="16" y="56"><tspan fill="#7ee787">pi@smarthub:~$</tspan> curl -fsSL …/install.sh | sudo bash</text>
      <text x="16" y="86"><tspan fill="#7ee787">[OK]</tspan> Compute Module 5</text>
      <text x="16" y="108"><tspan fill="#7ee787">[OK]</tspan> USER button · buzzer · LED0</text>
      <text x="16" y="130"><tspan fill="#7ee787">[OK]</tspan> WiFi supports AP mode</text>
      <text x="16" y="152"><tspan fill="#7ee787">[OK]</tspan> Service running <tspan fill="#ffd23f">Done!</tspan></text>
      <rect x="16" y="160" width="9" height="15" fill="#e6edf3"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- arrow -->
  <path d="M570 160h34" stroke="#1E9AD6" stroke-width="8" stroke-linecap="round"/>
  <path d="M598 146l16 14l-16 14" fill="none" stroke="#1E9AD6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- speech bubble -->
  <rect x="620" y="22" width="116" height="42" rx="21" fill="#fff" stroke="#1d2330" stroke-width="3"/>
  <path d="M664 62l-4 18l18 -18" fill="#fff" stroke="#1d2330" stroke-width="3" stroke-linejoin="round"/>
  <rect x="662" y="58" width="18" height="6" fill="#fff"/>
  <text x="678" y="50" font-size="18" font-weight="800" fill="#2e9e5b" text-anchor="middle">Ready!</text>

  <!-- SmartHub mascot -->
  <g transform="translate(628 104) scale(.75)">
    <rect x="-12" y="138" width="224" height="14" rx="5" fill="#3d434d" stroke="#1d2330" stroke-width="3"/>
    <rect x="160" y="-30" width="16" height="80" rx="8" fill="#5b616c" stroke="#1d2330" stroke-width="4"/>
    <rect x="0" y="30" width="200" height="115" rx="20" fill="#2b2f36" stroke="#1d2330" stroke-width="4"/>
    <path d="M22 50h156M22 62h156" stroke="#3f4550" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="70" cy="95" rx="11" ry="13" fill="#fff"/><ellipse cx="130" cy="95" rx="11" ry="13" fill="#fff"/>
    <circle cx="73" cy="98" r="5.5" fill="#1d2330"/><circle cx="133" cy="98" r="5.5" fill="#1d2330"/>
    <circle cx="75" cy="95" r="2" fill="#fff"/><circle cx="135" cy="95" r="2" fill="#fff"/>
    <path d="M86 115q14 12 28 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="114" r="7" fill="#ff8fa3" opacity=".6"/><circle cx="152" cy="114" r="7" fill="#ff8fa3" opacity=".6"/>
    <text x="100" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#9fd3f0">IRIV SmartHub CM5</text>
  </g>

  <!-- sparkles -->
  <g fill="#ffd23f" stroke="#1d2330" stroke-width="1.5">
    <path transform="translate(760 110)" d="M0-12L3-3L12 0L3 3L0 12L-3 3L-12 0L-3-3Z"/>
    <path transform="translate(616 236) scale(.7)" d="M0-12L3-3L12 0L3 3L0 12L-3 3L-12 0L-3-3Z"/>
    <path transform="translate(772 220) scale(.6)" d="M0-12L3-3L12 0L3 3L0 12L-3 3L-12 0L-3-3Z"/>
  </g>
</svg>
