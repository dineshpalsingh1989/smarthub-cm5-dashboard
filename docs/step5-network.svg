<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="2" y="2" width="796" height="306" rx="24" fill="#EAF5FC" stroke="#cfe6f5" stroke-width="3"/>
  <circle cx="46" cy="46" r="24" fill="#1E9AD6"/>
  <text x="46" y="55" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">5</text>

  <!-- phone with dashboard -->
  <rect x="76" y="16" width="184" height="280" rx="24" fill="#1d2330"/>
  <rect x="86" y="40" width="164" height="246" rx="10" fill="#f2f4f7"/>
  <rect x="148" y="24" width="40" height="6" rx="3" fill="#3d434d"/>
  <text x="96" y="62" font-size="13" font-weight="800" font-style="italic" fill="#1E9AD6">Cytron</text>
  <text x="146" y="61" font-size="10" font-weight="800" fill="#1d2330">SmartHub CM5</text>

  <!-- card 1: status -->
  <rect x="94" y="70" width="148" height="48" rx="6" fill="#fff"/>
  <text x="101" y="84" font-size="9" font-weight="800" fill="#1d2330">Status</text>
  <rect x="99" y="89" width="112" height="13" rx="3" fill="#fff3a3"/>
  <text x="102" y="99" font-size="9" font-weight="700" font-family="Consolas,Menlo,monospace" fill="#1d2330">eth0: 192.168.1.20</text>
  <text x="102" y="113" font-size="9" font-family="Consolas,Menlo,monospace" fill="#666">wlan0: AP 192.168.4.1</text>

  <!-- card 2: ethernet -->
  <rect x="94" y="126" width="148" height="62" rx="6" fill="#fff"/>
  <text x="101" y="140" font-size="9" font-weight="800" fill="#1d2330">Ethernet (eth0)</text>
  <rect x="101" y="146" width="134" height="16" rx="8" fill="#e9edf2"/>
  <rect x="101" y="146" width="67" height="16" rx="8" fill="#1E9AD6"/>
  <text x="134" y="158" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">DHCP</text>
  <text x="201" y="158" font-size="9" font-weight="700" fill="#666" text-anchor="middle">Static</text>
  <rect x="101" y="168" width="134" height="13" rx="4" fill="#1E9AD6"/>
  <text x="168" y="178" font-size="8" fill="#fff" text-anchor="middle">Apply</text>

  <!-- card 3: wifi -->
  <rect x="94" y="196" width="148" height="82" rx="6" fill="#fff"/>
  <text x="101" y="210" font-size="9" font-weight="800" fill="#1d2330">WiFi</text>
  <rect x="101" y="215" width="134" height="13" rx="4" fill="#1E9AD6"/>
  <text x="168" y="225" font-size="8" fill="#fff" text-anchor="middle">Search WiFi</text>
  <rect x="101" y="232" width="134" height="13" rx="3" fill="#fff" stroke="#c5cad3"/>
  <text x="105" y="242" font-size="8.5" fill="#1d2330">OfficeWiFi  (92%)</text>
  <text x="228" y="242" font-size="8" fill="#666">▾</text>
  <rect x="101" y="248" width="134" height="11" rx="3" fill="#fff" stroke="#c5cad3"/>
  <text x="105" y="257" font-size="9" fill="#1d2330">• • • • • • • •</text>
  <rect x="101" y="262" width="134" height="12" rx="4" fill="#2e9e5b"/>
  <text x="168" y="271" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">Connect</text>

  <!-- numbered markers + connectors -->
  <g stroke="#1E9AD6" stroke-width="2.5" stroke-dasharray="5 4" fill="none">
    <path d="M254 94H290"/><path d="M254 157H290"/><path d="M254 236H290"/>
  </g>
  <g font-size="12" font-weight="800" fill="#fff" text-anchor="middle">
    <circle cx="250" cy="94" r="11" fill="#f39c12"/><text x="250" y="98">1</text>
    <circle cx="250" cy="157" r="11" fill="#f39c12"/><text x="250" y="161">2</text>
    <circle cx="250" cy="236" r="11" fill="#f39c12"/><text x="250" y="240">3</text>
  </g>

  <!-- callouts -->
  <rect x="292" y="64" width="226" height="60" rx="12" fill="#fff" stroke="#cfe6f5" stroke-width="3"/>
  <text x="308" y="88" font-size="15" font-weight="800" fill="#1d2330">See the IP address</text>
  <text x="308" y="110" font-size="12" fill="#555">eth0 / wlan0 status, updates live</text>

  <rect x="292" y="127" width="226" height="60" rx="12" fill="#fff" stroke="#cfe6f5" stroke-width="3"/>
  <text x="308" y="151" font-size="15" font-weight="800" fill="#1d2330">Ethernet: DHCP or Static</text>
  <text x="308" y="173" font-size="12" fill="#555">set IP, gateway and DNS</text>

  <rect x="292" y="206" width="226" height="60" rx="12" fill="#fff" stroke="#cfe6f5" stroke-width="3"/>
  <text x="308" y="230" font-size="15" font-weight="800" fill="#1d2330">Connect to your WiFi</text>
  <text x="308" y="252" font-size="12" fill="#555">search, pick, password, Connect</text>

  <!-- arrow to result -->
  <path d="M524 236h22" stroke="#2e9e5b" stroke-width="6" stroke-linecap="round"/>
  <path d="M542 226l11 10l-11 10" fill="none" stroke="#2e9e5b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- router -->
  <path d="M628 56l-8 -30M712 56l8 -30" stroke="#5b616c" stroke-width="6" stroke-linecap="round"/>
  <rect x="604" y="52" width="132" height="46" rx="12" fill="#fff" stroke="#1d2330" stroke-width="3"/>
  <circle cx="626" cy="75" r="5" fill="#3ddc84"/><circle cx="644" cy="75" r="5" fill="#3ddc84"/><circle cx="662" cy="75" r="5" fill="#1E9AD6"/>
  <text x="670" y="116" font-size="12" font-weight="700" fill="#0B5E92" text-anchor="middle">Your WiFi router</text>

  <!-- link -->
  <path d="M676 158Q700 140 676 124" fill="none" stroke="#2e9e5b" stroke-width="4" stroke-dasharray="7 6">
    <animate attributeName="stroke-dashoffset" values="13;0" dur=".6s" repeatCount="indefinite"/>
  </path>

  <!-- SmartHub mascot (happy, joined) -->
  <g transform="translate(588 172) scale(.5)">
    <rect x="-12" y="138" width="224" height="14" rx="5" fill="#3d434d" stroke="#1d2330" stroke-width="3"/>
    <rect x="160" y="-30" width="16" height="80" rx="8" fill="#5b616c" stroke="#1d2330" stroke-width="4"/>
    <rect x="0" y="30" width="200" height="115" rx="20" fill="#2b2f36" stroke="#1d2330" stroke-width="4"/>
    <path d="M22 50h156M22 62h156" stroke="#3f4550" stroke-width="5" stroke-linecap="round"/>
    <path d="M58 97q12 -14 24 0M118 97q12 -14 24 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M82 112q18 18 36 0" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="48" cy="114" r="7" fill="#ff8fa3" opacity=".6"/><circle cx="152" cy="114" r="7" fill="#ff8fa3" opacity=".6"/>
    <text x="100" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#9fd3f0">IRIV SmartHub CM5</text>
  </g>
  <text x="670" y="272" font-size="13" font-weight="800" fill="#2e9e5b" text-anchor="middle">SmartHub joins your WiFi</text>
  <text x="670" y="290" font-size="11" fill="#777" text-anchor="middle">hotspot turns off (one radio)</text>
</svg>
