<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="2" y="2" width="796" height="286" rx="24" fill="#EAF5FC" stroke="#cfe6f5" stroke-width="3"/>
  <circle cx="46" cy="46" r="24" fill="#1E9AD6"/>
  <text x="46" y="55" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">3</text>

  <!-- SmartHub mascot sending WiFi -->
  <g transform="translate(70 96) scale(.85)">
    <rect x="-12" y="138" width="224" height="14" rx="5" fill="#3d434d" stroke="#1d2330" stroke-width="3"/>
    <rect x="160" y="-30" width="16" height="80" rx="8" fill="#5b616c" stroke="#1d2330" stroke-width="4"/>
    <rect x="0" y="30" width="200" height="115" rx="20" fill="#2b2f36" stroke="#1d2330" stroke-width="4"/>
    <path d="M22 50h156M22 62h156" stroke="#3f4550" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="70" cy="95" rx="11" ry="13" fill="#fff"/><ellipse cx="130" cy="95" rx="11" ry="13" fill="#fff"/>
    <circle cx="73" cy="98" r="5.5" fill="#1d2330"/><circle cx="133" cy="98" r="5.5" fill="#1d2330"/>
    <circle cx="75" cy="95" r="2" fill="#fff"/><circle cx="135" cy="95" r="2" fill="#fff"/>
    <path d="M86 115q14 12 28 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="114" r="7" fill="#ff8fa3" opacity=".6"/><circle cx="152" cy="114" r="7" fill="#ff8fa3" opacity=".6"/>
    <text x="100" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#9fd3f0">IRIV SmartHub CM5</text>
    <g fill="none" stroke="#1E9AD6" stroke-width="6" stroke-linecap="round">
      <path d="M190 -42A20 20 0 0 1 190 -10"><animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/></path>
      <path d="M204 -54A36 36 0 0 1 204 2"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></path>
    </g>
  </g>
  <text x="155" y="270" font-size="14" font-weight="700" fill="#0B5E92" text-anchor="middle" font-family="Consolas,Menlo,monospace">192.168.4.1</text>

  <!-- signal path -->
  <path d="M270 92Q350 40 440 110" fill="none" stroke="#1E9AD6" stroke-width="4" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" values="16;0" dur=".6s" repeatCount="indefinite"/>
  </path>

  <!-- phone -->
  <rect x="450" y="14" width="180" height="264" rx="24" fill="#1d2330"/>
  <rect x="461" y="40" width="158" height="226" rx="10" fill="#fff"/>
  <rect x="520" y="24" width="40" height="6" rx="3" fill="#3d434d"/>
  <text x="474" y="68" font-size="16" font-weight="800" fill="#1d2330">Wi-Fi</text>
  <rect x="574" y="55" width="32" height="16" rx="8" fill="#2e9e5b"/><circle cx="598" cy="63" r="6" fill="#fff"/>

  <rect x="467" y="80" width="146" height="38" rx="8" fill="#dff1fb" stroke="#1E9AD6" stroke-width="2"/>
  <g fill="none" stroke="#1E9AD6" stroke-width="2.5" stroke-linecap="round">
    <path d="M473 99a12 12 0 0 1 18 0"/><path d="M477 103a7 7 0 0 1 10 0"/>
  </g>
  <circle cx="482" cy="107" r="2" fill="#1E9AD6"/>
  <text x="498" y="105" font-size="15" font-weight="800" fill="#1d2330">smarthub</text>
  <rect x="588" y="98" width="12" height="10" rx="2" fill="#5b616c"/>
  <path d="M590 98v-3a4 4 0 0 1 8 0v3" fill="none" stroke="#5b616c" stroke-width="2"/>

  <text x="498" y="142" font-size="14" fill="#9aa1ab">HomeWiFi</text>
  <text x="498" y="168" font-size="14" fill="#9aa1ab">Office_2.4G</text>

  <rect x="469" y="184" width="142" height="72" rx="10" fill="#fff" stroke="#1E9AD6" stroke-width="2"/>
  <text x="479" y="203" font-size="11" fill="#777">Password</text>
  <rect x="477" y="211" width="88" height="26" rx="6" fill="#f2f4f7" stroke="#c5cad3"/>
  <text x="483" y="229" font-size="13" font-weight="700" fill="#1d2330" font-family="Consolas,Menlo,monospace">smarthub1</text>
  <rect x="569" y="211" width="36" height="26" rx="6" fill="#1E9AD6"/>
  <text x="587" y="229" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Join</text>

  <!-- sticky note -->
  <g transform="rotate(4 715 140)">
    <rect x="652" y="62" width="128" height="150" rx="4" fill="#fff3a3" stroke="#e0c84a" stroke-width="2"/>
    <rect x="692" y="54" width="48" height="16" fill="#cfe6f5" opacity=".85"/>
    <text x="666" y="96" font-size="13" fill="#6b5d10">WiFi name</text>
    <text x="666" y="120" font-size="19" font-weight="800" fill="#1d2330">smarthub</text>
    <text x="666" y="152" font-size="13" fill="#6b5d10">Password</text>
    <text x="666" y="176" font-size="19" font-weight="800" fill="#1d2330">smarthub1</text>
  </g>
</svg>
