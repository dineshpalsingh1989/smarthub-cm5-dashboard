<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="2" y="2" width="796" height="266" rx="24" fill="#EAF5FC" stroke="#cfe6f5" stroke-width="3"/>
  <rect x="24" y="16" width="116" height="28" rx="14" fill="#ffd23f" stroke="#1d2330" stroke-width="2"/>
  <text x="82" y="35" font-size="13" font-weight="800" fill="#1d2330" text-anchor="middle">NEW in V2.0</text>

  <!-- ===== left: hotspot ON ===== -->
  <text x="210" y="70" font-size="18" font-weight="800" fill="#c27c0e" text-anchor="middle">Hotspot ON</text>
  <g transform="translate(50 108) scale(.6)">
    <rect x="-12" y="138" width="224" height="14" rx="5" fill="#3d434d" stroke="#1d2330" stroke-width="3"/>
    <rect x="160" y="-30" width="16" height="80" rx="8" fill="#5b616c" stroke="#1d2330" stroke-width="4"/>
    <rect x="0" y="30" width="200" height="115" rx="20" fill="#2b2f36" stroke="#1d2330" stroke-width="4"/>
    <path d="M22 50h156M22 62h156" stroke="#3f4550" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="70" cy="95" rx="11" ry="13" fill="#fff"/><ellipse cx="130" cy="95" rx="11" ry="13" fill="#fff"/>
    <circle cx="73" cy="98" r="5.5" fill="#1d2330"/><circle cx="133" cy="98" r="5.5" fill="#1d2330"/>
    <path d="M86 115q14 12 28 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="114" r="7" fill="#ff8fa3" opacity=".6"/><circle cx="152" cy="114" r="7" fill="#ff8fa3" opacity=".6"/>
    <g fill="none" stroke="#1E9AD6" stroke-width="7" stroke-linecap="round">
      <path d="M190 -42A20 20 0 0 1 190 -10"><animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/></path>
      <path d="M204 -54A36 36 0 0 1 204 2"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></path>
    </g>
  </g>
  <!-- phone using dashboard -->
  <rect x="232" y="86" width="64" height="112" rx="12" fill="#1d2330"/>
  <rect x="238" y="98" width="52" height="90" rx="5" fill="#eef2f6"/>
  <rect x="242" y="103" width="20" height="5" rx="2.5" fill="#1E9AD6"/>
  <rect x="242" y="113" width="20" height="12" rx="2" fill="#fff"/><rect x="266" y="113" width="20" height="12" rx="2" fill="#fff"/>
  <rect x="242" y="129" width="44" height="22" rx="2" fill="#fff"/><rect x="246" y="142" width="36" height="5" rx="2" fill="#0a84c6"/>
  <rect x="242" y="155" width="44" height="28" rx="2" fill="#fff"/><rect x="246" y="174" width="36" height="5" rx="2" fill="#d03a2f"/>
  <!-- port sign -->
  <rect x="40" y="212" width="320" height="42" rx="12" fill="#fff" stroke="#1d2330" stroke-width="2.5"/>
  <circle cx="62" cy="233" r="7" fill="#1f9d55"/>
  <text x="78" y="238" font-size="14.5" font-weight="800" fill="#1d2330">Port 8080: dashboard OPEN</text>

  <!-- ===== middle: switch ===== -->
  <path d="M400 70V250" stroke="#9fc9e4" stroke-width="2.5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="150" r="26" fill="#1E9AD6" stroke="#1d2330" stroke-width="2.5"/>
  <path d="M388 150h20M400 140l10 10l-10 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="340" y="92" width="120" height="24" rx="12" fill="#fff" stroke="#9fc9e4" stroke-width="2"/>
  <text x="400" y="108" font-size="11.5" font-weight="700" fill="#0B5E92" text-anchor="middle">Hold USER 5 s</text>

  <!-- ===== right: hotspot OFF ===== -->
  <text x="590" y="70" font-size="18" font-weight="800" fill="#6b7684" text-anchor="middle">Hotspot OFF</text>
  <g transform="translate(440 108) scale(.6)">
    <rect x="-12" y="138" width="224" height="14" rx="5" fill="#3d434d" stroke="#1d2330" stroke-width="3"/>
    <rect x="160" y="-30" width="16" height="80" rx="8" fill="#5b616c" stroke="#1d2330" stroke-width="4"/>
    <rect x="0" y="30" width="200" height="115" rx="20" fill="#2b2f36" stroke="#1d2330" stroke-width="4"/>
    <path d="M22 50h156M22 62h156" stroke="#3f4550" stroke-width="5" stroke-linecap="round"/>
    <path d="M58 95q12 10 24 0M118 95q12 10 24 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="100" cy="120" rx="6" ry="5" fill="#fff"/>
    <circle cx="48" cy="114" r="7" fill="#ff8fa3" opacity=".6"/><circle cx="152" cy="114" r="7" fill="#ff8fa3" opacity=".6"/>
  </g>
  <g font-weight="800" fill="#1E9AD6">
    <text x="556" y="142" font-size="14">z<animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></text>
    <text x="568" y="128" font-size="18">z<animate attributeName="opacity" values="0;1;0" dur="2s" begin=".5s" repeatCount="indefinite"/></text>
    <text x="584" y="112" font-size="22">Z<animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite"/></text>
  </g>
  <!-- other app -->
  <rect x="622" y="92" width="152" height="86" rx="12" fill="#fff" stroke="#1d2330" stroke-width="2.5"/>
  <rect x="636" y="106" width="26" height="26" rx="6" fill="#8e44ad"/>
  <path d="M643 119h12M649 113v12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="670" y="118" font-size="13" font-weight="800" fill="#1d2330">Your other</text>
  <text x="670" y="134" font-size="13" font-weight="800" fill="#1d2330">app</text>
  <text x="636" y="158" font-size="11" fill="#6b7684">can use the port now</text>
  <text x="636" y="172" font-size="10" fill="#9aa1ab">Node-RED, Grafana, ...</text>
  <text x="622" y="197" font-size="10.5" fill="#6b7684">button still listens · ~0% CPU</text>
  <!-- port sign -->
  <rect x="440" y="212" width="334" height="42" rx="12" fill="#fff" stroke="#1d2330" stroke-width="2.5"/>
  <circle cx="462" cy="233" r="7" fill="#d5dbe2" stroke="#9aa1ab" stroke-width="1.5"/>
  <text x="478" y="238" font-size="14.5" font-weight="800" fill="#1d2330">Port 8080: closed and FREE</text>
</svg>
